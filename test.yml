# ================= 1. 报告基本信息 =================
report_info:
  title: "直梯运行状态智能化深度诊断报告"
  intro_text: "本次报告聚焦于风险评估最严重的预警项。触发警报源于位置【{loc}】的【{comp}】。"
  conclusion_text: "判定结果：【{device} - {fault}】健康度存在风险"
  desc_text: "经系统计算，该指标当前得分为 {score} 分，健康状态概率分布为：[{fuzzy_str}]，为本次巡检中退化最严重的环节。"
  no_img_text: "当前报警项为环境状态，无需波形图验证。"
  disclaimer_text: "本报告由直梯状态智能化深度诊断系统自动生成。诊断结论仅反映设备在对应采样时间窗口内的健康度分布，仅供参考，不作为最终法定强制停机或事故责任判定的唯一依据。"

# ================= 2. 传感器环境与设备映射 =================
sensor_mapping:
  "81025": 
    location: "中科院西侧"
    component: "曳引机"
    bearing_params: {rpm: 1500.0, n_rollers: 8, d_roller: 10.0, D_pitch: 50.0, beta: 0.0}
  "81026": 
    location: "中科院东侧"
    component: "钢丝绳"
  "81027": 
    location: "中科院主楼"
    component: "轿厢"
  "81028": 
    location: "中科院主楼"
    component: "导轨"
  "ENV_001":
    location: "机房/底坑"
    component: "环境与电气"

# ================= 3. 专家评估与维修建议 =================
expert_advice:
  motor_fault:
    H1: "【良好】曳引机电机运行平稳，特征频率未见异常，建议保持常规巡检。"
    H2: "【轻度】电机出现轻微振动上升趋势，建议缩短巡检周期，检查润滑状态。"
    H3: "【预警】电机振动明显，基础可能存在松动，建议停梯检查固定底座及同心度。"
    H4: "【高危】电机存在严重的运行异常，建议立即停机检测！"
  rotor_misalignment:
    H1: "【良好】电机定转子同心度良好，无不对中现象。"
    H2: "【轻度】电机二倍频略有上升，提示存在轻微的不对中趋势，建议后续维护时检查联轴器或底座。"
    H3: "【预警】电机二倍频显著增高，存在明显的转子不对中，可能加速轴承与联轴器磨损，建议安排对中校准。"
    H4: "【高危】检测到严重的转子不对中特征！设备承受巨大交变应力，极易发生断轴或扫膛，请立即停机使用激光对中仪重新校准！"
  stator_eccentricity:
    H1: "【良好】电机气隙均匀，无定子偏心现象。"
    H2: "【轻度】特征频率表明气隙略有不均，可能是基础轻微变形或紧固受力不均导致，保持观察。"
    H3: "【预警】存在明显的定子偏心特征，电磁噪音可能增大，长期运行将导致绝缘老化，建议检查定子紧固状态。"
    H4: "【高危】检测到极严重的定子偏心！气隙严重不均面临扫膛毁机的极高风险，请立即断电停机大修！"
  bearing_fault:
    H1: "【良好】轴承包络谱干净，无异常冲击信号，运行状态优良。"
    H2: "【轻度】高频区出现微弱底噪增加，建议补充润滑脂。"
    H3: "【预警】包络谱识别到早期滚动体或内外圈故障频率，建议准备备件并密切监控。"
    H4: "【高危】包络谱出现明显内外圈/滚动体故障特征频率，存在碎裂风险，请立即开盖更换轴承。"
  bearing_cage:
    H1: "【良好】保持架状态稳定。"
    H2: "【轻度】保持架运行状态正常，高频端偶有微弱波动，维持观察。"
    H3: "【预警】识别到保持架特征频率波动，因其容错率极低，需高度关注。"
    H4: "【高危】保持架出现明显磨损特征，存在突发性碎裂卡死风险，建议立即停机大修。"
  bolt_loose:
    H1: "【良好】底座刚度正常，未见松动松脱。"
    H2: "【轻度】底座振动偶有增大，尚未构成松动特征，建议常规巡检时观察。"
    H3: "【预警】发现间歇性松动特征振动，建议安排力矩扳手复紧作业。"
    H4: "【高危】检测到严重的宽频冲击信号，必须立即禁行并重新锁紧打上扭力标！"
  wire_rope:
    H1: "【良好】钢丝绳振幅基线正常，受力均匀。"
    H2: "【轻度】钢丝绳振幅轻微波动，受力状态正常，维持常规润滑。"
    H3: "【预警】钢丝绳RMS振幅偏大，可能存在早期磨损或轻微张力不均，建议做测力平衡。"
    H4: "【高危】钢丝绳RMS振幅极高，疑似严重打滑或断丝缺油，必须立刻停梯进行探伤检测！"
  guide_rail:
    H1: "【良好】导轨表面平整，磨损率极低，运行平稳。"
    H2: "【轻度】导轨存在轻微磨损痕迹，属于正常老化范畴，建议定期润滑。"
    H3: "【预警】导轨磨损指标偏高，可能导致轿厢轻微晃动，建议加强润滑并列入近期观察计划。"
    H4: "【高危】导轨磨损指标严重超限，可能导致轿厢剧烈抖动卡阻，建议立即全面校轨更换导靴。"
  frame_vibration:
    H1: "【良好】轿架Z轴运行平稳，无明显冲击振动。"
    H2: "【轻度】轿架Z轴存在微小振动，不影响乘坐舒适度，保持常规维护。"
    H3: "【预警】Z轴方向出现异常振动，建议检查导靴间隙及曳引钢丝绳张力平衡。"
    H4: "【高危】检测到严重的Z轴（上下）冲击与震动超标！可能存在反绳轮轴承碎裂、导靴严重磨损或导轨接头错位，请立刻停梯全面排查轿架机械结构！"
  smoothness:
    H1: "【良好】轿厢水平运行极其平稳，舒适度极佳。"
    H2: "【轻度】轿厢水平方向有偶发轻微晃动，属于正常范围。"
    H3: "【预警】轿厢X/Y轴（水平方向）摆动超标，乘坐平稳度下降，可能存在导轨局部变形或轿厢偏载现象，建议安排校轨。"
    H4: "【高危】轿厢出现剧烈的水平晃动，极易导致门刀刮碰刮蹭，存在安全隐患，建议立即停机检查导靴与导轨磨损情况！"
  water:
    H1: "【良好】机房及底坑环境干燥，无积水隐患。"
    H2: "【轻度】环境湿度稍高，建议检查通风或除湿设备。"
    H3: "【预警】检测到底坑或机房有早期渗水/漏水迹象，请尽快安排人员清理并排查漏水点。"
    H4: "【高危】检测到底坑或机房发生严重水浸，极易引发电气短路与溜梯事故，请立即拉闸断电！"
  temperature:
    H1: "【良好】机房及控制柜温度在理想工作范围内。"
    H2: "【轻度】温度略有上升，但仍在设备安全允许范围内，保持观察。"
    H3: "【预警】机房或控制柜温度逼近告警阈值，建议开启空调或增强排风散热。"
    H4: "【高危】机房或控制柜温度严重超标，存在死机烧毁风险，请立即检查机房空调与排风设备。"
  displacement:
    H1: "【良好】建筑及设备结构稳定，无异常物理位移。"
    H2: "【轻度】传感器出现微弱位移波动，可能为测量环境干扰，建议定期校准。"
    H3: "【预警】检测到可见的物理位移趋势，基座或承重结构可能受力变形，请安排工程复测。"
    H4: "【高危】设备出现超出安全阈值的异常物理位移，必须立刻全面停梯测量结构沉降！"
  motor_current:
    H1: "【良好】曳引机电机电流输出平稳，无异常波动。"
    H2: "【轻度】电机电流存在轻微波动，可能与负载变化有关，属正常现象。"
    H3: "【预警】电机电流出现周期性或突发性异常波动，可能存在抱闸未完全松开或电气接触不良，建议排查。"
    H4: "【高危】电机电流严重超标或发生三相不平衡，存在烧毁电机风险，请立即停机检查控制柜与电气回路！"
  noise_ratio:
    H1: "【良好】机房运行声学环境正常，无异常机械噪音。"
    H2: "【轻度】检测到轻微的异常声响，不影响运行安全，建议下次保养时关注。"
    H3: "【预警】机房噪音水平明显升高，可能存在轴承干磨或部件松动，建议尽早安排维保人员到场确认。"
    H4: "【高危】检测到剧烈的异常撕裂声或金属摩擦噪音，发生机械性损毁的概率极高，请立刻停梯！"
  default:
    H1: "【良好】状态正常，按计划维保。"
    H2: "【轻度】出现轻微性能下降，保持观察。"
    H3: "【预警】性能指标逼近红线，建议现场复核。"
    H4: "【高危】设备出现未知严重异常，请立刻停梯安排人工全面排查！"

# ================= 4. 可视化指标打印配置 =================
visual_config:
  wire_rope: {display_metrics: ["rms_baseline_ratio", "score"]}
  car: {display_metrics: ["frame_vibration", "smoothness", "score"]}
  motor_fault: {display_metrics: ["rms_ratio", "confidence", "score"]}
  rotor_misalignment: {display_metrics: ["rms_ratio", "confidence", "score"]}
  stator_eccentricity: {display_metrics: ["rms_ratio", "confidence", "score"]}
  bearing_fault: {display_metrics: ["rms_ratio", "inner", "outer", "cage", "score"]}
  bolt_loose: {display_metrics: ["rms_ratio", "score"]}
  guide_rail: {display_metrics: ["wear_percent", "score"]}

# ================= 5. 健康度评估体系 =================
health_evaluation:
  device_weights:
    曳引机: 0.25
    钢丝绳: 0.25
    导轨: 0.25
    轿厢: 0.25
  fault_weights:
    motor_fault: 0.3
    bearing_fault: 0.5
    bolt_loose: 0.2
  bearing_sub_weights:
    inner: 0.3
    outer: 0.3
    cage: 0.2
    ball: 0.2
  env_checks:
    enable_temperature: true
    enable_water: true
    enable_current: true
    enable_noise: true
    enable_displacement: true

# ================= 6. LLM 专家建议生成配置 =================
llm_config:
  enable_llm: false
  model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  temperature: 0.8
  max_tokens: 256

# ================= 7. 信号特征基线配置 =================
signal_baselines:
  motor_fault: 1
  bearing_fault: 1
  bolt_loose: 1
  wire_rope: 1
  car: 1

# ================= 8. 电机故障诊断频域容差参数 =================
motor_params:
  ratio2_misalign: 0.6
  ratio3_misalign: 0.3
  ratio2_eccentric: 0.3
  ratio3_eccentric: 0.15

# ================= 9. RMS 窗口滑窗与触发机制 =================
rms_window:
  duration_sec: 2.0    # 每个RMS分析窗口的持续时间（秒）
  trigger_ratio: 1.0   # 异常设定值 (rms / baseline > 该设定值计为1次异常)
  trigger_count: 3     # 触发深入分析所需的【连续】异常窗口数量