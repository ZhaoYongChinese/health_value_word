# ========================================================
# 现场配置项：用于分配各级设备的权重及开启/关闭环境检测功能
# ========================================================

# 1. 机械本体设备的权重划分 (第一层设备级)
device_weights:
  曳引机: 0.25
  钢丝绳: 0.25
  导轨: 0.25
  轿厢: 0.25

# 2. 曳引机内部主要故障的权重划分 (第二层故障级)
fault_weights:
  motor_fault: 0.3
  bearing_fault: 0.5
  bolt_loose: 0.2

# 3. 轴承内部各部位磨损的权重划分 (第三层子部位级)
bearing_sub_weights:
  inner: 0.3   # 内圈
  outer: 0.3   # 外圈
  cage: 0.2    # 保持架
  ball: 0.2    # 滚动体

# 4. 环境与电气附加检测开关 (true: 启用, false: 停用)
env_checks:
  enable_temperature: true  # 机房/设备温度检测
  enable_water: true        # 底坑/机房水浸检测
  enable_current: true      # 电机电流异常检测
  enable_noise: true        # 异常噪声检测
  enable_displacement: true # 设备位移检测