# ================= 1. 报告基本信息 =================
report_info:
  title: "直梯运行状态智能化深度诊断报告"

# ================= 2. 传感器环境与设备映射 =================
sensor_mapping:
  "81025": {location: "中科院西侧", component: "曳引机"}
  "81026": {location: "中科院东侧", component: "钢丝绳"}
  "81027": {location: "中科院主楼", component: "轿厢"}
  "81028": {location: "中科院主楼", component: "导轨"}

# ================= 3. 专家评估与维修建议 =================
expert_advice:
  motor_fault:
    H1: "曳引机电机运行平稳，建议保持日常巡检。"
    H3: "【预警】电机振动明显，建议停梯检查固定底座及同心度。"
    H4: "【高危】电机存在严重的转子不对中或定子偏心，建议立即停机进行激光对中校准！"
  bearing_fault:
    H4: "【高危】轴承包络谱出现明显内外圈/滚动体故障特征频率，存在碎裂风险，请立即停机开盖更换轴承。"
  bearing_cage:
    H4: "【高危】轴承保持架出现明显磨损特征，由于保持架容忍度极低，存在突发性碎裂卡死风险，建议立即停机大修。"
  bolt_loose:
    H4: "【高危】检测到严重的宽频冲击信号，曳引机底座螺栓极度松动，必须立即禁行并重新锁紧打上扭力标！"
  wire_rope:
    H4: "【高危】钢丝绳RMS振幅极高，疑似严重打滑或张力极度不均，必须立刻停梯进行曳引轮和钢丝绳探伤检测！"
  guide_rail:
    H4: "【高危】导轨磨损指标严重超限，可能导致轿厢剧烈抖动卡阻，建议立即全面校轨更换导靴。"
  car:
    H4: "【高危】轿厢出现严重的三轴宽频振动，平稳度极差，建议立刻检查导靴磨损、反绳轮及风速干扰。"
  # 新增环境建议
  water:
    H4: "【高危】检测到底坑或机房发生严重水浸，极易引发电气短路与溜梯事故，请立即拉闸断电，并安排抽水烘干！"
  temperature:
    H4: "【高危】机房或控制柜温度严重超标，主板与变频器存在死机/烧毁风险，请立即检查机房空调与排风设备。"
  displacement:
    H4: "【高危】设备出现超出安全阈值的异常物理位移，基础结构可能发生沉降或形变，必须立刻全面停梯测量复位！"
  default:
    H4: "【高危】设备出现未知严重异常，请立刻停梯安排人工全面排查！"

# ================= 4. 可视化指标打印配置 =================
visual_config:
  wire_rope: {display_metrics: ["rms_baseline_ratio", "score"]}
  car: {display_metrics: ["avg_vibration", "score"]}
  motor_fault: {display_metrics: ["rms_ratio", "confidence", "score"]}
  bearing_fault: {display_metrics: ["rms_ratio", "inner", "outer", "cage", "score"]}
  bolt_loose: {display_metrics: ["rms_ratio", "score"]}
  guide_rail: {display_metrics: ["wear_percent", "score"]}

# ================= 5. 健康度评估体系 (同 health_config.yml 仅保留权重) =================
health_evaluation:
  device_weights:
    曳引机: 0.4
    钢丝绳: 0.2
    导轨: 0.15
    轿厢: 0.25
  fault_weights:
    motor_fault: 0.3
    bearing_fault: 0.5
    bolt_loose: 0.2
  bearing_sub_weights:
    inner: 0.3
    outer: 0.3
    cage: 0.2
    ball: 0.2
  env_checks:
    enable_temperature: true
    enable_water: true
    enable_current: true
    enable_noise: true
    enable_displacement: true